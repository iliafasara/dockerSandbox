version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.backend
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - FLASK_ENV=development
      - DOCKER_SANDBOX_IMAGE=python-sandbox:latest
    depends_on:
      - sandbox-builder

  sandbox-builder:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: python-sandbox:latest